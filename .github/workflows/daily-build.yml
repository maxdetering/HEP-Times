name: Daily ArXiv Build

on:
  schedule:
    # 02:00 UTC Mon-Fri — 60 minutes after ArXiv's 01:00 UTC paper release
    - cron: '0 2 * * 1-5'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: |
          curl -s -X POST "${{ secrets.NETLIFY_BUILD_HOOK_URL }}"
